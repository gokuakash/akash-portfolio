<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150d14"/>
      <stop offset="1" stop-color="#241025"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1025"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#c8ff3d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- tokens -->
  <g transform="translate(900 180)">
    <rect width="200" height="46" rx="23" fill="#e879f9" opacity="0.9"/>
    <rect width="120" height="46" rx="23" x="220" fill="#101018" stroke="#e879f9" stroke-width="2"/>
    <rect width="90" height="46" rx="23" x="360" fill="url(#volt)"/>
    <rect y="64" width="440" height="160" rx="20" fill="#101018" stroke="#e879f9" stroke-opacity="0.5"/>
  </g>
  <!-- button grid -->
  <g font-family="monospace">
    <text x="90" y="180" font-size="52" letter-spacing="8" fill="#ffe9fd">MUSE</text>
    <text x="90" y="232" font-size="15" letter-spacing="4" fill="#e879f9">DESIGN SYSTEM / TOKENS / MOTION</text>
    <text x="90" y="880" font-size="44" letter-spacing="3" fill="#c8ff3d">8.2K STARS · 96% REUSE</text>
  </g>
  <!-- easing curve -->
  <g transform="translate(130 620)">
    <line x1="0" y1="220" x2="520" y2="220" stroke="#6b4b6b" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#6b4b6b" stroke-width="2"/>
    <path d="M0 220 C120 220 160 20 520 20" fill="none" stroke="url(#volt)" stroke-width="4"/>
    <circle cx="0" cy="220" r="8" fill="#c8ff3d"/>
    <circle cx="520" cy="20" r="8" fill="#c8ff3d"/>
  </g>
  <circle cx="1480" cy="880" r="16" fill="#e879f9"/>
  <circle cx="1520" cy="880" r="16" fill="#c8ff3d"/>
</svg>